<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>My Task Board</h1>
        <p>Organize your daily tasks</p>
      </header>
      <section class="stats">
        <div>
          <h3>5</h3>
          <p>Total Tasks</p>
        </div>
        <div>
          <h3>2</h3>
          <p>Done Tasks</p>
        </div>
        <div>
          <h3>2</h3>
          <p>High Priority</p>
        </div>
      </section>

      <section class="add-task">
        <h2>Add New Task</h2>
        <form>
          <div class="form-group">
            <label for="task">Task Name</label>
            <input type="text" id="task" placeholder="Enter your task" />
          </div>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority">
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </div>
          <button type="button">Add Task</button>
        </form>
      </section>

      <section class="task-list">
        <h2>My Tasks</h2>
        <ul>
          <li>
            <input type="checkbox" id="task1" />
            <label for="task1" class="task-title">Learn HTML</label>
            <span class="badge high">High</span>
            <button type="button" class="delete">Delete</button>
          </li>
          <li>
            <input type="checkbox" id="task2" />
            <label for="task2" class="task-title">Learn CSS basics</label>
            <span class="badge medium">Medium</span>
            <button type="button" class="delete">Delete</button>
          </li>
          <li>
            <input type="checkbox" id="task3" />
            <label for="task3" class="task-title">Practice Flexbox</label>
            <span class="badge high">High</span>
            <button type="button" class="delete">Delete</button>
          </li>
          <li>
            <input type="checkbox" id="task4" />
            <label for="task4" class="task-title">Create Task Board</label>
            <span class="badge medium">Medium</span>
            <button type="button" class="delete">Delete</button>
          </li>
          <li>
            <input type="checkbox" id="task5" />
            <label for="task5" class="task-title">Practice Git commands</label>
            <span class="badge low">Low</span>
            <button type="button" class="delete">Delete</button>
          </li>
        </ul>
      </section>

      <section class="task-detail">
        <h2>Task Details</h2>
        <article>
          <h3>Create Task Board</h3>
          <p>
            <strong>Description:</strong> Build a simple Task Board using HTML
            and CSS.
          </p>
          <p><strong>Priority:</strong> Medium</p>
          <p><strong>Status:</strong> Pending</p>
        </article>
      </section>
    </main>
  </body>
</html>
